apiVersion: v1
kind: ServiceAccount
metadata:
  name: contabo-fip-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: contabo-fip-controller
rules:
  - apiGroups: [""]
    resources: [nodes, services]
    verbs: [get, list, watch]
  # Events are recorded on the watched Services.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: contabo-fip-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: contabo-fip-controller
subjects:
  - kind: ServiceAccount
    name: contabo-fip-controller
    namespace: contabo-fip-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: contabo-fip-controller-leader-election
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: contabo-fip-controller-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: contabo-fip-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: contabo-fip-controller
