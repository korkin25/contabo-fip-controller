# Example overlay: set the floating IP and the Services, and project the
# Contabo credentials from Vault with External Secrets Operator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - external-secret.yaml
images:
  - name: ghcr.io/korkin25/contabo-fip-controller
    newTag: v0.1.0
patches:
  - target:
      kind: Deployment
      name: contabo-fip-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "203.0.113.10"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: envoy-gateway-system/public,netbird/relay
