# Example overlay: set the floating IP and the Services, and project the
# Contabo credentials from Vault with External Secrets Operator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - external-secret.yaml
images:
  - name: ghcr.io/korkin25/contabo-fip-controller
    newTag: v0.1.0
patches:
  # Strategic merge: the container and the env entries match by name.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: contabo-fip-controller
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: FLOATING_IP
                    value: "203.0.113.10"
                  - name: SERVICES
                    value: envoy-gateway-system/public,netbird/relay
