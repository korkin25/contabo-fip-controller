# The restricted Contabo API user (VIP permissions only) lives in Vault at
# secret/<env>/contabo-fip-controller; ESO projects it into the Secret the
# Deployment reads. Restart the pods after rotating the credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contabo-fip-controller-credentials
  namespace: contabo-fip-controller
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: contabo-fip-controller-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: prod/contabo-fip-controller
